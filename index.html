<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side by Side</title>
  <meta name="description" content="Formulation and treatment planning for the Child First team, shaped for real life: one thought at a time, from a phone, between visits.">

  <!-- PWA / installable app (works offline once loaded once) -->
  <meta name="theme-color" content="#2E5D4E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Side by Side">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Fonts (self-hosted so they render with no network) -->
  <link href="assets/fonts.css" rel="stylesheet">

  <!-- Vendored locally (self-hosted) so the app has zero external requests and works offline -->
  <script src="assets/react.production.min.js"></script>
  <script src="assets/react-dom.production.min.js"></script>
  <script src="assets/babel.min.js"></script>

  <script>
    // LocalStorage Shim for window.storage to persist state in standard browsers
    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          try {
            const value = localStorage.getItem(key);
            return value ? { value } : null;
          } catch (e) {
            console.error("Failed to read from localStorage", e);
            return null;
          }
        },
        set: async (key, value) => {
          try {
            localStorage.setItem(key, value);
          } catch (e) {
            console.error("Failed to write to localStorage", e);
          }
        }
      };
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- React Code compiled on-the-fly via Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { Plus, Trash2, ChevronDown, ChevronLeft, ChevronRight, Download,
      Printer, Copy, Check, Sparkles, Quote, ArrowLeft, BookOpen, Link2,
      ExternalLink, X, CalendarClock, Users, Upload } = {
      Plus: (props) => <span {...props}>+</span>,
      Trash2: (props) => <span {...props}>🗑</span>,
      ChevronDown: (props) => <span {...props}>▼</span>,
      ChevronLeft: (props) => <span {...props}>◀</span>,
      ChevronRight: (props) => <span {...props}>▶</span>,
      Download: (props) => <span {...props}>⬇</span>,
      Printer: (props) => <span {...props}>🖨</span>,
      Copy: (props) => <span {...props}>📋</span>,
      Check: (props) => <span {...props}>✓</span>,
      Sparkles: (props) => <span {...props}>✨</span>,
      Quote: (props) => <span {...props}>❝</span>,
      ArrowLeft: (props) => <span {...props}>←</span>,
      BookOpen: (props) => <span {...props}>📖</span>,
      Link2: (props) => <span {...props}>🔗</span>,
      ExternalLink: (props) => <span {...props}>↗</span>,
      X: (props) => <span {...props}>✕</span>,
      CalendarClock: (props) => <span {...props}>📅</span>,
      Users: (props) => <span {...props}>👥</span>,
      Upload: (props) => <span {...props}>⬆</span>,
    };

    /* ============================================================
       SIDE BY SIDE v3 : a Child First planning companion
       Built for FRPs and clinicians equally. Phone-first. Autosaves.
       Lightweight by default, deeper on demand.
       ============================================================ */

    const STORE_KEY = "sbs_frp_planner_v2";
    const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

    const ROLES = ["FRP", "Clinician"];
    const ROLE_CAPTIONS = {
      FRP: "Care coordination, concrete needs, executive functioning. Diagnosis stays with the clinician.",
      Clinician: "Dyadic mental health work, formulation, diagnosis. Stabilization runs with the FRP.",
    };

    /* ---------- six assessment domains, from the Sources of Assessment worksheet ---------- */
    const DOMAINS = [
      { key: "dev", title: "Child Development", measures: "ASQ-3, M-CHAT R/F",
        hint: "Motor, language, problem solving, personal-social. What is on track, what lags, and does the caregiver see it too?" },
      { key: "seb", title: "Child Social-Emotional & Behavioral", measures: "ASQ:SE-2 / BITSEA / PKBS-2, TESI-PRR",
        hint: "Big feelings, aggression, withdrawal, sleep, feeding. What has this child lived through? The behavior at its worst, and at its best." },
      { key: "att", title: "Attachment & Relationships", measures: "CCIS, PSI-4-SF",
        hint: "What happens between them. Who reaches, who retreats, who repairs. Moments of delight count as data." },
      { key: "cg", title: "Caregiver Strengths & Challenges", measures: "PQ, CESD-R, PCL-5, LSC-R",
        hint: "Her own story: stress, mood, trauma load, and everything she has survived. Name what she does well in gritty detail." },
      { key: "health", title: "Child & Family Health", measures: "HOPE, health history",
        hint: "Medical, dental, vision, sleep, nutrition, insurance. Small health wins stabilize everything else." },
      { key: "sniff", title: "Service Needs", measures: "SNIFF",
        hint: "The concrete world: housing, food, transport, childcare, utilities, benefits, legal. What is unstable, what has been tried, what nearly works?" },
    ];

    const COL = {
      strengths: { label: "Strengths", short: "Strengths", ph: "One exact strength" },
      vulns: { label: "Vulnerabilities", short: "Vulnerabilities", ph: "One concern, in plain words" },
      explore: { label: "Explore further", short: "Further areas and sources for exploration", ph: "One open question" },
      services: { label: "Possible services", short: "Possible community services", ph: "One referral or support" },
    };
    const KINDS = ["strengths", "vulns", "explore", "services"];

    const MEASURE_STATUS = ["Not yet", "Scheduled", "Completed", "Declined", "N/A"];

    const MEASURES = {
      dev: [
        {
          key: "asq3", name: "ASQ-3", full: "Ages & Stages Questionnaires, third edition",
          who: "Caregiver report",
          what: "Developmental screen across communication, gross motor, fine motor, problem solving and personal-social.",
          scoreHint: "Interval used, and each area: above cutoff, monitoring zone, or below cutoff",
          lookS: ["Areas well within range: ", "Skills the caregiver sees at home that the form missed: ", "Area in the monitoring range but not yet a concern: "],
          lookV: ["Areas below cutoff: ", "Areas in the monitoring zone: ", "What the caregiver names as her own worry: ", "Feeding: ", "Bowel or digestion: ", "Coordination: "],
          ask: [
            "How does this child communicate without words?",
            "Does communication look different at home than at child care? What is different about each place?",
            "Was there a time more skills were present? Any loss of skills, and roughly when?",
            "Do the caregiver's worries match what the screen shows, or is there a gap between them?",
            "What was happening in the family around the time she first noticed?",
            "Has the pediatrician screened development, and what came of it?",
            "How might picky eating shape the day: hungry, tired, harder to engage?",
            "Could discomfort from bowel trouble be lowering his willingness to engage?",
          ],
          refer: ["Early Intervention referral", "Speech and language evaluation", "Developmental pediatrician", "Pediatric follow-up on screen results"],
        },
      ],
      seb: [
        {
          key: "asqse", name: "ASQ:SE-2", full: "Ages & Stages Questionnaires: Social-Emotional, second edition",
          who: "Caregiver report",
          what: "Social-emotional screen: self-regulation, compliance, social communication, adaptive skills, autonomy, affect, interaction.",
          scoreHint: "Total against the interval cutoff, plus the monitoring zone and any single high-concern item",
          lookS: ["Seeks comfort and affection by: ", "Settles back to sleep by: ", "Pretend play looks like: ", "Lets the caregiver know he needs help by: ", "What the caregiver says she loves about him: ", "Engages with others when: "],
          lookV: ["Score above the cutoff for concern", "Does not initiate or follow bids for shared attention", "Does not tell anyone when hurt, hungry or tired", "Long tantrums that are hard to soothe", "Hits other children", "Repetitive actions: ", "Sleep: ", "Parents worried about: "],
          ask: [
            "When he does ask for help, what exactly does that look like? Name it out loud so it can be caught next time.",
            "What kind of play brings the smile? Build the plan on that.",
            "How can the team help the caregiver notice his initiations and follow his lead, so he can stay engaged longer?",
            "When he tantrums and cannot be comforted, what settings or moments set it off?",
            "What are transitions like at child care, and what can hold him there until services land?",
            "When he wakes at night and settles himself, what keeps him safe?",
          ],
          refer: ["Child care mental health consultation", "Dyadic parent-child treatment", "Sleep and routine support"],
        },
      ],
      att: [
        {
          key: "ccis", name: "CCIS", full: "Child-Caregiver Interaction Scale",
          who: "Direct observation",
          what: "What actually happens between them, watched rather than reported. Moments of delight count as data.",
          scoreHint: "Date and setting of the observation, and which subscales stood out",
          lookS: ["Attends to his needs even while exhausted: ", "Initiates positive interaction by: ", "Is affectionate when: ", "He initiates physical contact by: ", "Moment of mutual delight: "],
          lookV: ["Cues missed or misread, likely because they are subtle: ", "Limit setting is inconsistent", "Expectations pitched to his chronological rather than developmental age", "He does not seek her out for help settling", "His affect is often neutral or serious", "Little turn taking in the interaction", "They do not often play together"],
          ask: [
            "How does this child signal? If the cues are subtle, name them out loud so she can start catching them.",
            "How does she understand what is developmentally expectable right now? Can a skill be framed as still being learned rather than missing?",
            "Where is he advanced? Pairing a strength with an emerging skill makes the frame easier to hold.",
            "How does she read a serious or flat affect? Does it echo anyone from her own history?",
            "How does it feel for her that he does not play the way she hoped he would?",
            "Where is the mutual delight? It is far more likely in an activity he chose.",
          ],
          refer: ["Dyadic parent-child treatment", "Abecedarian activities", "Video feedback on a play moment"],
        },
      ],
      cg: [
        {
          key: "pq", name: "PQ", full: "Parent Questionnaire",
          who: "Caregiver self-report, best at the first visit",
          what: "Her own account, in her own words. What she wants, and what she is worried about.",
          scoreHint: "Date completed",
          lookS: ["What she names as going well: ", "Supports she already has: ", "What she is asking for help with: "],
          lookV: ["Worries she names: ", "What she says she cannot get to: "],
          ask: [
            "What does she say she wants first? Start there even if the measures point somewhere else.",
            "What is she not asking about that the other measures are flagging?",
          ],
          refer: [],
        },
      ],
      health: [
        {
          key: "hope", name: "HOPE", full: "Home Observation for the Parent and Environment",
          who: "Direct observation in the home",
          what: "Physical environment, safety, materials, routines, and the everyday health picture.",
          scoreHint: "Date of the observation",
          lookS: ["Physical environment: ", "Age-appropriate books and toys present", "Growing as expected and generally healthy", "Routines that already work: "],
          lookV: ["Picky eating", "Wakes many times a night", "Frequent constipation or diarrhea", "Safety hazards: ", "Missed well-child or dental visits"],
          ask: [
            "With a new baby or a growing child, will they need baby proofing or new equipment, and what will it cost?",
            "Is he still in a crib? Will he need to transition, or will the family need another one?",
            "What happens at mealtime? Are there small changes to offering, timing, or reading his hunger cues worth trying, with her food culture kept in view?",
            "Could sensory sensitivity explain the food refusal rather than willfulness?",
            "What does bedtime look like, and is it predictable? What do they do when he wakes?",
          ],
          refer: ["Nutritionist familiar with toddlers and sensory sensitivity", "WIC", "Pediatric or dental follow-up", "Safe sleep supplies"],
        },
      ],
      sniff: [
        {
          key: "sniff", name: "SNIFF", full: "Service Needs Inventory for Families",
          who: "Caregiver report, at intake, quarterly, and at discharge",
          what: "The concrete world, and what the family is already asking for.",
          scoreHint: "Date completed, and the family's own top priority",
          lookS: ["Does not need help with: ", "Already connected to: ", "Has managed on their own: "],
          lookV: ["Requests help with: ", "Unstable right now: ", "Tried before and it broke down at: "],
          ask: [
            "Which request is the family's top priority, in their own words?",
            "What has already been tried, and where exactly did it break down?",
            "If a professional's suggestion offended the caregiver, what is the repair? That relationship is the whole pathway.",
            "What can be started this week while the longer referrals move?",
            "What does he need right now to take part fully where he already spends his days?",
          ],
          refer: ["Early Intervention", "Child care mental health consultation", "Nutrition referral", "Housing or utility assistance", "Legal aid", "Transportation support", "Help finding different child care"],
        },
      ],
    };

    const ALL_MEASURES = DOMAINS.flatMap((d) => (MEASURES[d.key] || []).map((m) => ({ ...m, domain: d.key })));

    const emptyBag = () => ({ strengths: [], vulns: [], explore: [], services: [] });
    const emptyEntry = () => ({ status: "Not yet", date: "", score: "", items: emptyBag() });

    function asBag(raw) {
      const b = emptyBag();
      if (!raw || typeof raw !== "object") return b;
      Object.keys(b).forEach((k) => {
        const v = raw[k];
        if (Array.isArray(v)) b[k] = v.map((it) => (typeof it === "string" ? { id: uid(), t: it } : { id: it.id || uid(), t: it.t || "" }));
        else if (typeof v === "string" && v.trim()) b[k] = v.split("\n").map((s) => s.trim()).filter(Boolean).map((s) => ({ id: uid(), t: s }));
      });
      return b;
    }

    function readDomain(assessment, dk) {
      const raw = (assessment || {})[dk] || {};
      const legacy = KINDS.some((k) => typeof raw[k] === "string");
      const gen = asBag(legacy ? raw : raw.gen);
      const m = {};
      (MEASURES[dk] || []).forEach((meas) => {
        const e = (raw.m || {})[meas.key] || {};
        m[meas.key] = { ...emptyEntry(), ...e, items: asBag(e.items) };
      });
      return { m, gen };
    }

    const bagCount = (bag) => Object.keys(bag).reduce((n, k) => n + bag[k].filter((i) => (i.t || "").trim()).length, 0);
    function domainCount(assessment, dk) {
      const d = readDomain(assessment, dk);
      return bagCount(d.gen) + Object.keys(d.m).reduce((n, k) => n + bagCount(d.m[k].items), 0);
    }

    function ymdToDate(s) {
      if (!s) return null;
      const p = s.split("-").map(Number);
      if (p.length !== 3 || !p[0] || !p[1] || !p[2]) return null;
      return new Date(p[0], p[1] - 1, p[2]);
    }

    function fmtDate(dt) {
      return dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }

    function daysUntil(dt) {
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      return Math.round((dt - now) / 86400000);
    }

    function relLabel(dt) {
      const d = daysUntil(dt);
      if (d < 0) return Math.abs(d) + "d overdue";
      if (d === 0) return "today";
      return "in " + d + "d";
    }

    function keyDates(setup) {
      const start = ymdToDate(setup.startDate);
      if (!start) return null;
      const addDays = (dt, n) => { const x = new Date(dt); x.setDate(x.getDate() + n); return x; };
      const addMonths = (dt, n) => { const x = new Date(dt); x.setMonth(x.getMonth() + n); return x; };
      const initialDue = addDays(start, 60);
      const planBase = ymdToDate(setup.planDate) || initialDue;
      return {
        baselineBy: addDays(start, 28),
        initialDue,
        hasPlan: !!ymdToDate(setup.planDate),
        reviews: [addDays(planBase, 90), addDays(planBase, 180), addDays(planBase, 270)],
        sniff: [addMonths(start, 3), addMonths(start, 6), addMonths(start, 9)],
        sixMonth: addMonths(start, 6),
      };
    }

    function soonest(setup) {
      const k = keyDates(setup);
      if (!k) return null;
      if (!k.hasPlan) return { label: "Initial plan due", date: k.initialDue };
      const next = k.reviews.find((r) => daysUntil(r) >= -30) || k.reviews[0];
      return { label: "Next review due", date: next };
    }

    const blankCase = () => ({
      id: uid(), createdAt: Date.now(), updatedAt: Date.now(),
      setup: { child: "", age: "", caregiver: "", clinician: "", frp: "", role: "FRP", startDate: "", planDate: "" },
      assessment: {}, strengthsBank: [],
      formulation: { lenses: {}, rubric: {}, problemMap: "", meaning: "", playMoment: "", caregiverWords: "", frpAngle: "", bringToClinician: "" },
      goals: [],
    });

    function canUseLocalStorage() {
      try { const k = "__sbs_test__"; window.localStorage.setItem(k, "1"); window.localStorage.removeItem(k); return true; }
      catch (e) { return false; }
    }

    async function loadStore() {
      let raw = null;
      try {
        if (window.storage) {
          try { const res = await window.storage.get(STORE_KEY); if (res && res.value) raw = res.value; } catch (e) {}
        }
        if (!raw && canUseLocalStorage()) raw = window.localStorage.getItem(STORE_KEY);
        const data = raw ? JSON.parse(raw) : { cases: [], links: {} };
        if (!data.links) data.links = {};
        if (!data.cases) data.cases = [];
        return data;
      } catch (e) { return { cases: [], links: {} }; }
    }

    async function saveStore(data) {
      const json = JSON.stringify(data);
      let ok = false;
      if (window.storage) { try { await window.storage.set(STORE_KEY, json); ok = true; } catch (e) {} }
      if (canUseLocalStorage()) { try { window.localStorage.setItem(STORE_KEY, json); ok = true; } catch (e) {} }
      return ok;
    }

    function encodeBackup(obj) {
      try { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); } catch (e) { return ""; }
    }

    function decodeBackup(b64) {
      try { return JSON.parse(decodeURIComponent(escape(atob(b64)))); } catch (e) { return null; }
    }

    function parseBackup(text) {
      const m = String(text || "").match(/SIDE_BY_SIDE_BACKUP:v1:BASE64\s+([A-Za-z0-9+/=]+)/);
      if (!m) return null;
      return decodeBackup(m[1]);
    }

    /* ============================================================ ATOMS */
    function Eyebrow({ children }) { return <div style={{ fontSize: "11px", letterSpacing: "0.14em", textTransform: "uppercase", color: "#2E5D4E", fontWeight: 700, marginBottom: "6px" }}>{children}</div>; }

    function AutoTA({ value, onChange, placeholder, minRows = 2 }) {
      const ref = useRef(null);
      const resize = () => { const el = ref.current; if (!el) return; el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; };
      useEffect(resize, [value]);
      return <textarea ref={ref} rows={minRows} style={{ width: "100%", fontFamily: "inherit", fontSize: "16px", padding: "10px 12px", border: "1px solid #E3DFD3", borderRadius: "11px", resize: "none", overflow: "hidden", lineHeight: "1.5" }} value={value || ""} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} />;
    }

    function Collapse({ title, sub, children, badge, defaultOpen = false, filled }) {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div style={{ background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px" }}>
          <button style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px", background: "none", border: "none", cursor: "pointer", padding: "14px 16px", textAlign: "left", fontFamily: "inherit" }} aria-expanded={open} onClick={() => setOpen(!open)}>
            <div style={{ minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
                <span style={{ fontWeight: 700, fontSize: "15px", color: "#22333B" }}>{title}</span>
                {badge}
                {filled ? <span style={{ width: "7px", height: "7px", borderRadius: "50%", background: "#E8A33D", display: "inline-block" }} title="has notes" /> : null}
              </div>
              {sub ? <div style={{ fontSize: "12px", color: "#5D6B70", marginTop: "2px" }}>{sub}</div> : null}
            </div>
            <span style={{ transition: "transform .2s", color: "#B0A98F", flexShrink: 0, transform: open ? "rotate(180deg)" : "none" }}>▼</span>
          </button>
          {open ? <div style={{ padding: "0 16px 16px" }}>{children}</div> : null}
        </div>
      );
    }

    function Field({ label, value, onChange, ph, type }) {
      return (
        <label style={{ display: "block" }}>
          <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>{label}</div>
          <input style={{ width: "100%", background: "#FDFCF9", border: "1px solid #E3DFD3", borderRadius: "11px", padding: "10px 12px", fontFamily: "inherit", fontSize: "16px", color: "#22333B", outline: "none" }} type={type || "text"} value={value || ""} placeholder={ph} onChange={(e) => onChange(e.target.value)} />
        </label>
      );
    }

    function SectionIntro({ title, body }) {
      return <div style={{ padding: "4px 2px 0" }}><h2 style={{ fontFamily: "Bricolage Grotesque, sans-serif", fontWeight: 700, fontSize: "1.45rem", margin: "0 0 6px", letterSpacing: "-0.01em" }}>{title}</h2><p style={{ color: "#5D6B70", fontSize: "14px", margin: 0 }}>{body}</p></div>;
    }

    /* ============================================================ APP */
    export default function App() {
      const [store, setStore] = useState(null);
      const [activeId, setActiveId] = useState(null);
      const [step, setStep] = useState(0);
      const [storageOk, setStorageOk] = useState(true);
      const [savedTick, setSavedTick] = useState(false);
      const saveTimer = useRef(null);

      useEffect(() => {
        (async () => {
          const data = await loadStore();
          setStore(data || { cases: [], links: {} });
          setStorageOk(!!window.storage || canUseLocalStorage());
        })();
      }, []);

      const persist = useCallback((next) => {
        setStore(next);
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async () => {
          const ok = await saveStore(next);
          if (ok) { setSavedTick(true); setTimeout(() => setSavedTick(false), 1400); }
          else setStorageOk(false);
        }, 600);
      }, []);

      if (!store) {
        return <div style={{ minHeight: "100vh", background: "#FBFAF6", color: "#22333B", fontFamily: "Albert Sans, system-ui, sans-serif", fontSize: "15px", lineHeight: "1.55" }}><div style={{ padding: "40px", textAlign: "center", color: "#5D6B70", fontSize: "14px" }}>Opening the planning space...</div></div>;
      }

      const activeCase = store.cases.find((c) => c.id === activeId) || null;
      const updateCase = (patch) =>
        persist({ ...store, cases: store.cases.map((c) => (c.id === activeId ? { ...c, ...patch, updatedAt: Date.now() } : c)) });
      const newCase = () => { const c = blankCase(); persist({ ...store, cases: [c, ...store.cases] }); setActiveId(c.id); setStep(0); };
      const deleteCase = (id) => { persist({ ...store, cases: store.cases.filter((c) => c.id !== id) }); if (activeId === id) setActiveId(null); };
      const importCase = (caseData) => {
        const base = blankCase();
        const c = {
          ...base, ...caseData,
          id: uid(), createdAt: Date.now(), updatedAt: Date.now(),
          setup: { ...base.setup, ...(caseData.setup || {}) },
          assessment: caseData.assessment || {},
          strengthsBank: Array.isArray(caseData.strengthsBank) ? caseData.strengthsBank : [],
          formulation: { ...base.formulation, ...(caseData.formulation || {}) },
          goals: Array.isArray(caseData.goals) ? caseData.goals : [],
        };
        persist({ ...store, cases: [c, ...store.cases] }); setActiveId(c.id); setStep(0);
      };

      return (
        <div style={{ minHeight: "100vh", background: "#FBFAF6", color: "#22333B", fontFamily: "Albert Sans, system-ui, sans-serif", fontSize: "15px", lineHeight: "1.55" }}>
          {!storageOk && (
            <div style={{ background: "#FDECEC", color: "#7C2D2D", borderBottom: "1px solid #F2C9C9", padding: "10px 16px", fontSize: "13px", textAlign: "center" }}>Autosave is not available in this view. Work lives only in this session, so export before closing.</div>
          )}
          {!activeCase ? (
            <HomeScreen store={store} onNew={newCase} onOpen={(id) => { setActiveId(id); setStep(0); }} onDelete={deleteCase} onImport={importCase} />
          ) : (
            <CaseEditor data={activeCase} step={step} setStep={setStep} onBack={() => setActiveId(null)} update={updateCase} savedTick={savedTick} />
          )}
        </div>
      );
    }

    /* ============================================================ HOME */
    function HomeScreen({ store, onNew, onOpen, onDelete, onImport }) {
      const [armed, setArmed] = useState(null);
      const [importErr, setImportErr] = useState("");
      const fileRef = useRef(null);
      const handleFile = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const parsed = parseBackup(reader.result);
          if (!parsed) { setImportErr("Couldn't find backup data in that file. Restore uses a .md exported from Side by Side."); return; }
          setImportErr(""); onImport(parsed);
        };
        reader.onerror = () => setImportErr("That file couldn't be read. Try again.");
        reader.readAsText(file);
      };
      return (
        <div style={{ maxWidth: "40rem", margin: "0 auto", padding: "0 1.1rem 3rem" }}>
          <header style={{ paddingTop: "32px", paddingBottom: "24px" }}>
            <Eyebrow>Child First · FRP + Clinician</Eyebrow>
            <h1 style={{ fontFamily: "Bricolage Grotesque, sans-serif", fontWeight: 800, fontSize: "2.35rem", lineHeight: "1.02", letterSpacing: "-0.02em", margin: "0 0 10px" }}>Side by Side</h1>
            <p style={{ color: "#5D6B70", fontSize: "15px", maxWidth: "32rem", margin: 0 }}>Formulation and treatment planning for the Child First team, shaped for real life: one thought at a time, from a phone, between visits.</p>
          </header>

          <div style={{ background: "#FBFAF6", border: "1px solid #EFD9B4", borderRadius: "14px", padding: "12px 14px", fontSize: "13.5px", color: "#6E5424" }}>Initials only in here. Full names, birth dates, and addresses stay out of this space. A thinking tool, not the medical record.</div>

          <button style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "7px", background: "#2E5D4E", color: "#fff", border: "none", cursor: "pointer", padding: "12px 18px", borderRadius: "999px", fontWeight: 600, fontSize: "14.5px", fontFamily: "inherit", width: "100%", marginTop: "20px" }} onClick={onNew}>➕ Start a new case draft</button>
          <button style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "7px", background: "transparent", color: "#2E5D4E", border: "1px solid #E3DFD3", cursor: "pointer", padding: "11px 18px", borderRadius: "999px", fontWeight: 600, fontSize: "14px", fontFamily: "inherit", width: "100%", marginTop: "10px" }} onClick={() => fileRef.current && fileRef.current.click()}>⬆️ Restore a case from a .md backup</button>
          <input ref={fileRef} type="file" accept=".md,.markdown,text/markdown,text/plain" onChange={handleFile} style={{ display: "none" }} />
          {importErr ? <div style={{ background: "#FDECEC", border: "1px solid #F2C9C9", color: "#7C2D2D", borderRadius: "12px", padding: "10px 13px", fontSize: "13px", marginTop: "10px" }}>{importErr}</div> : null}

          <div style={{ marginTop: "28px" }}>
            {store.cases.length === 0 ? (
              <div style={{ border: "1.5px dashed #E3DFD3", borderRadius: "16px", padding: "26px 18px", textAlign: "center", color: "#5D6B70", fontSize: "14px" }}>No drafts yet. Start one, and it will be waiting here next time this app opens.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                {store.cases.slice().sort((a, b) => b.updatedAt - a.updatedAt).map((c) => {
                  const chip = soonest(c.setup);
                  return (
                    <div key={c.id} style={{ display: "flex", alignItems: "stretch", gap: "8px" }}>
                      <button style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px", background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px", padding: "14px 16px", cursor: "pointer", textAlign: "left", fontFamily: "inherit", minWidth: 0 }} onClick={() => onOpen(c.id)}>
                        <div style={{ minWidth: 0 }}>
                          <div style={{ fontWeight: 700, fontSize: "15.5px", color: "#22333B" }}>
                            {c.setup.child || "Untitled"}
                            {c.setup.age ? <span style={{ fontWeight: 500, color: "#5D6B70" }}> · {c.setup.age}</span> : null}
                          </div>
                          <div style={{ fontSize: "12.5px", color: "#5D6B70", marginTop: "2px" }}>{c.goals.length} goal{c.goals.length === 1 ? "" : "s"} drafted · updated {new Date(c.updatedAt).toLocaleDateString()}</div>
                          {chip ? (
                            <div style={{ display: "inline-flex", alignItems: "center", gap: "4px", marginTop: "7px", fontSize: "11.5px", fontWeight: 600, color: daysUntil(chip.date) < 0 ? "#7C2D2D" : daysUntil(chip.date) <= 14 ? "#B57A17" : "#5D6B70", background: daysUntil(chip.date) < 0 ? "#FBE7E7" : daysUntil(chip.date) <= 14 ? "#FBF0DC" : "#F1EFE6", borderRadius: "999px", padding: "3px 9px" }}>
                              📅 {chip.label} {relLabel(chip.date)}
                            </div>
                          ) : null}
                        </div>
                        <span style={{ opacity: 0.4, flexShrink: 0 }}>▶</span>
                      </button>
                      <button aria-label="Delete draft" style={{ background: armed === c.id ? "#A9603F" : "transparent", color: armed === c.id ? "#fff" : "#9BA6A0", border: "1px solid transparent", borderRadius: "12px", padding: "0 10px", fontFamily: "inherit", fontSize: "12px", fontWeight: 700, cursor: "pointer" }} onClick={() => (armed === c.id ? onDelete(c.id) : setArmed(c.id))} onBlur={() => setArmed(null)}>
                        {armed === c.id ? "Sure?" : "🗑"}
                      </button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <footer style={{ marginTop: "40px", paddingTop: "16px", borderTop: "1px solid #E3DFD3", color: "#5D6B70", fontSize: "13px" }}>Two roles, one plan. The clinician holds the dyadic mental health work and diagnosis; the FRP holds stabilization, access, and executive functioning. Everyone notices. This app drafts one contribution; the official plan gets built together.</footer>
        </div>
      );
    }

    /* ============================================================ EDITOR */
    const STEPS = ["Setup", "Assess", "Formulate", "Goals", "Export"];

    function CaseEditor({ data, step, setStep, onBack, update, savedTick }) {
      const s = data.setup;
      const role = s.role || "FRP";
      const names = {
        child: s.child || "the child",
        caregiver: s.caregiver || "the caregiver",
        role, partnerRole: role === "FRP" ? "Clinician" : "FRP",
      };
      return (
        <div style={{ maxWidth: "40rem", margin: "0 auto", padding: "0 1.1rem 128px" }}>
          <div style={{ position: "sticky", top: 0, zIndex: 20, display: "flex", alignItems: "center", justifyContent: "space-between", background: "#FBFAF6", padding: "10px 0 8px", marginBottom: "24px" }}>
            <button style={{ display: "inline-flex", alignItems: "center", gap: "6px", background: "none", border: "none", color: "#5D6B70", cursor: "pointer", fontFamily: "inherit", fontSize: "14px", fontWeight: 600, padding: "8px 10px", borderRadius: "10px" }} onClick={onBack}>← Cases</button>
            <div style={{ fontFamily: "Bricolage Grotesque, sans-serif", fontWeight: 700, fontSize: "16px" }}>{s.child || "New draft"}</div>
            <div style={{ display: "flex", alignItems: "center", gap: "4px", fontSize: "12px", color: "#2E5D4E", opacity: savedTick ? 1 : 0, transition: "opacity .3s" }}>✓ saved</div>
          </div>

          <div style={{ marginTop: "20px" }} key={step}>
            {step === 0 && <SetupStep data={data} update={update} />}
            {step === 1 && <AssessStep data={data} update={update} names={names} />}
            {step === 2 && <FormulateStep data={data} update={update} names={names} />}
            {step === 3 && <GoalsStep data={data} update={update} names={names} />}
            {step === 4 && <ExportStep data={data} names={names} />}
          </div>

          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 30, display: "flex", justifyContent: "space-between", alignItems: "center", gap: "10px", maxWidth: "40rem", margin: "0 auto", padding: "12px 1.1rem calc(12px + env(safe-area-inset-bottom))", background: "linear-gradient(to top, #FBFAF6 70%, rgba(251, 250, 246, 0))" }}>
            <button style={{ display: "inline-flex", alignItems: "center", gap: "6px", background: "none", border: "none", color: "#5D6B70", cursor: step === 0 ? "default" : "pointer", fontFamily: "inherit", fontSize: "14px", fontWeight: 600, opacity: step === 0 ? 0.35 : 1 }} disabled={step === 0} onClick={() => setStep(step - 1)}>◀ Back</button>
            {step < STEPS.length - 1 ? (
              <button style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "7px", background: "#2E5D4E", color: "#fff", border: "none", cursor: "pointer", padding: "12px 18px", borderRadius: "999px", fontWeight: 600, fontSize: "14.5px", fontFamily: "inherit" }} onClick={() => setStep(step + 1)}>{STEPS[step + 1]} ▶</button>
            ) : <div />}
          </div>
        </div>
      );
    }

    /* ============================================================ STEP 0 : SETUP */
    function SetupStep({ data, update }) {
      const s = data.setup;
      const set = (k, v) => update({ setup: { ...s, [k]: v } });
      const role = s.role || "FRP";
      const k = keyDates(s);
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
          <SectionIntro title="Who is at the table" body="Initials or first names only. Enough to keep the case straight, not enough to identify anyone." />
          <div style={{ background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px", padding: "16px", display: "flex", flexDirection: "column", gap: "16px" }}>
            <Field label="Child (initials)" value={s.child} onChange={(v) => set("child", v)} ph="e.g., J.M." />
            <Field label="Age" value={s.age} onChange={(v) => set("age", v)} ph="e.g., 2y 4m" />
            <Field label="Caregiver (initials or role)" value={s.caregiver} onChange={(v) => set("caregiver", v)} ph="e.g., Mom, D.R., Grandma" />
          </div>

          <div style={{ background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px", padding: "16px", display: "flex", flexDirection: "column", gap: "16px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "8px" }}><span>👥</span><div style={{ fontWeight: 700, fontSize: "15px", color: "#22333B" }}>The team</div></div>
            <div>
              <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>This draft is written as</div>
              <div style={{ display: "flex", background: "#F1EFE6", border: "1px solid #E3DFD3", borderRadius: "999px", padding: "3px", gap: "3px" }} role="radiogroup" aria-label="Working role">
                {ROLES.map((r) => (
                  <button key={r} role="radio" aria-checked={role === r} style={{ flex: 1, border: "none", background: role === r ? "#2E5D4E" : "transparent", color: role === r ? "#fff" : "#5D6B70", padding: "9px 10px", borderRadius: "999px", fontFamily: "inherit", fontWeight: 700, fontSize: "14px", cursor: "pointer", transition: "background .15s,color .15s" }} onClick={() => set("role", r)}>{r}</button>
                ))}
              </div>
              <div style={{ fontSize: "12.5px", color: "#5D6B70", marginTop: "7px" }}>{ROLE_CAPTIONS[role]}</div>
            </div>
            <Field label="Name" value={s.frp} onChange={(v) => set("frp", v)} ph="Whoever is drafting this" />
            <Field label={"Teammate (" + (role === "FRP" ? "clinician" : "FRP") + ")"} value={s.clinician} onChange={(v) => set("clinician", v)} ph="Who this draft gets brought to" />
          </div>

          <div style={{ background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px", padding: "16px", display: "flex", flexDirection: "column", gap: "16px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "8px" }}><span>📅</span><div style={{ fontWeight: 700, fontSize: "15px", color: "#22333B" }}>Dates that drive deadlines</div></div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
              <Field label="Treatment start" type="date" value={s.startDate} onChange={(v) => set("startDate", v)} />
              <Field label="Initial plan signed" type="date" value={s.planDate} onChange={(v) => set("planDate", v)} />
            </div>
            <div style={{ fontSize: "13px", color: "#5D6B70" }}>A start date is enough to surface the deadlines. Adding the plan-signed date later starts the review clock from there.</div>
          </div>

          {k ? (
            <div style={{ background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px", padding: "14px" }}>
              <div style={{ fontFamily: "Bricolage Grotesque, sans-serif", fontWeight: 700, fontSize: "15px", marginBottom: "8px" }}>Key dates for this family</div>
              <div style={{ display: "flex", flexDirection: "column" }}>
                {[
                  { label: "Baseline battery done by", date: k.baselineBy, note: "first 4 weeks", done: false },
                  { label: k.hasPlan ? "Initial plan (signed)" : "Initial Plan of Care due", date: k.hasPlan ? ymdToDate(s.planDate) : k.initialDue, note: "60 days from start", done: k.hasPlan },
                  { label: "First quarterly review", date: k.reviews[0], note: "every 90 days after", done: false },
                  { label: "6-month follow-up window", date: k.sixMonth, note: "re-administer core measures", done: false },
                  { label: "Next SNIFF (quarterly)", date: k.sniff[0], note: "intake, quarterly, discharge", done: false },
                ].map((r, i) => {
                  const d = daysUntil(r.date);
                  const bgColor = r.done ? "#BFD4C4" : d < 0 ? "#FBDBDB" : d <= 14 ? "#FBF0DC" : "#F1EFE6";
                  const dotColor = r.done ? "#BFD4C4" : d < 0 ? "#A9603F" : d <= 14 ? "#E8A33D" : "#2E5D4E";
                  return (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: "11px", padding: "9px 0", borderTop: "1px solid #F0EDE3" }}>
                      <span style={{ width: "9px", height: "9px", borderRadius: "50%", flexShrink: 0, background: dotColor }} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: "13.5px", fontWeight: 600, color: "#22333B" }}>{r.label}</div>
                        <div style={{ fontSize: "11.5px", color: "#5D6B70" }}>{r.note}</div>
                      </div>
                      <div style={{ textAlign: "right", flexShrink: 0 }}>
                        <div style={{ fontSize: "13px", fontWeight: 600, color: "#22333B" }}>{fmtDate(r.date)}</div>
                        {!r.done ? <div style={{ fontSize: "11px", color: "#5D6B70" }}>{relLabel(r.date)}</div> : <div style={{ fontSize: "11px", color: "#5D6B70" }}>logged</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{ marginTop: "10px", paddingTop: "9px", borderTop: "1px solid #F0EDE3", fontSize: "11.5px", color: "#5D6B70" }}>Deadlines from the CFCR Quick Reference and the assessment timing guidelines. Confirm against CFCR, which is the system of record.</div>
            </div>
          ) : null}
        </div>
      );
    }

    /* ============================================================ STEP 1 : ASSESS */
    function AssessStep({ data, update, names }) {
      const a = data.assessment || {};
      const bank = data.strengthsBank || [];
      const [newStrength, setNewStrength] = useState("");
      const addStrength = () => { const t = newStrength.trim(); if (!t) return; update({ strengthsBank: [...bank, t] }); setNewStrength(""); };

      const writeDomain = (dk, next) => update({ assessment: { ...a, [dk]: next } });
      const setEntry = (dk, mk, patch) => {
        const dom = readDomain(a, dk);
        writeDomain(dk, { ...dom, m: { ...dom.m, [mk]: { ...dom.m[mk], ...patch } } });
      };

      const loggedMeasures = DOMAINS.reduce((n, d) => {
        const dom = readDomain(a, d.key);
        return n + (MEASURES[d.key] || []).filter((meas) => {
          const e = dom.m[meas.key];
          return bagCount(e.items) > 0 || (e.score || "").trim() || (e.status && e.status !== "Not yet");
        }).length;
      }, 0);

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
          <SectionIntro title="What the assessments are telling us" body="The Sources of Assessment worksheet, one instrument at a time instead of one giant grid. Log what each measure told you, sort it into the four columns, and leave the rest for later visits." />

          <div style={{ background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px", padding: "16px" }}>
            <div style={{ height: "6px", borderRadius: "999px", background: "#EDE9DE", overflow: "hidden" }}>
              <span style={{ display: "block", height: "100%", background: "#2E5D4E", borderRadius: "999px", transition: "width .25s ease", width: (ALL_MEASURES.length ? Math.round((loggedMeasures / ALL_MEASURES.length) * 100) : 0) + "%" }} />
            </div>
            <div style={{ fontSize: "13px", color: "#5D6B70", marginTop: "8px" }}>
              <b style={{ color: "#22333B" }}>{loggedMeasures} of {ALL_MEASURES.length}</b> measures logged
            </div>
          </div>

          {DOMAINS.map((d) => {
            const dom = readDomain(a, d.key);
            const list = MEASURES[d.key] || [];
            const done = (list || []).filter((meas) => {
              const e = dom.m[meas.key];
              return bagCount(e.items) > 0 || (e.score || "").trim() || (e.status && e.status !== "Not yet");
            }).length;
            const count = domainCount(a, d.key);
            return (
              <Collapse
                key={d.key}
                title={d.title}
                sub={d.measures}
                filled={count > 0}
                badge={<span style={{ fontSize: "11.5px", fontWeight: 700, color: done === list.length && list.length ? "#fff" : "#5D6B70", background: done === list.length && list.length ? "#2E5D4E" : "#EDE9DE", borderRadius: "999px", padding: "2px 9px" }}>{done}/{list.length}</span>}
              >
                <div style={{ fontSize: "13px", color: "#5D6B70", marginBottom: "12px" }}>{d.hint}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                  {list.map((meas) => (
                    <MeasureCard
                      key={meas.key}
                      meas={meas}
                      entry={dom.m[meas.key]}
                      onEntry={(patch) => setEntry(d.key, meas.key, patch)}
                      names={names}
                    />
                  ))}
                </div>
              </Collapse>
            );
          })}

          <div style={{ background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px", padding: "16px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "8px" }}><span>✨</span><div style={{ fontWeight: 700, fontSize: "15px", color: "#22333B" }}>Strengths bank</div></div>
            <div style={{ fontSize: "13px", color: "#5D6B70", marginTop: "4px" }}>Collect the gritty, specific kind. Not "Mom is resilient" but "Mom kept every WIC appointment for six months while sharing one phone among three people."</div>
            <div style={{ display: "flex", gap: "8px", marginTop: "12px" }}>
              <input style={{ width: "100%", fontFamily: "inherit", fontSize: "16px", padding: "10px 12px", border: "1px solid #E3DFD3", borderRadius: "11px", background: "#FDFCF9" }} value={newStrength} placeholder="One exact strength, in plain words" onChange={(e) => setNewStrength(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addStrength()} />
              <button style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "7px", background: "#2E5D4E", color: "#fff", border: "none", cursor: "pointer", padding: "12px 18px", borderRadius: "999px", fontWeight: 600, fontSize: "14.5px", fontFamily: "inherit", flexShrink: 0 }} aria-label="Add strength" onClick={addStrength}>➕</button>
            </div>
            {bank.length > 0 && (
              <ul style={{ marginTop: "12px", display: "flex", flexDirection: "column", gap: "8px", padding: 0 }}>
                {bank.map((sv, i) => (
                  <li key={i} style={{ display: "flex", alignItems: "flex-start", gap: "8px", background: "#FDFCF9", border: "1px solid #E3DFD3", borderRadius: "11px", padding: "9px 12px", fontSize: "14px", listStyle: "none" }}><span style={{ flex: 1 }}>{sv}</span>
                    <button style={{ background: "none", border: "none", color: "#C0B9A5", cursor: "pointer", padding: "3px", borderRadius: "7px" }} aria-label="Remove strength" onClick={() => update({ strengthsBank: bank.filter((_, j) => j !== i) })}>🗑</button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </div>
      );
    }

    function MeasureCard({ meas, entry, onEntry, names }) {
      const [open, setOpen] = useState(false);
      const n = bagCount(entry.items);
      const touched = n > 0 || (entry.score || "").trim() || (entry.status && entry.status !== "Not yet");
      const statusClass = entry.status === "Completed" ? "#2E5D4E" : entry.status === "Scheduled" ? "#E8A33D" : entry.status === "Declined" || entry.status === "N/A" ? "#D0D4D8" : "#EDE9DE";

      return (
        <div style={{ border: "1px solid #E3DFD3", borderRadius: "13px", background: "#FDFCF9", overflow: "hidden", borderLeft: touched ? "3px solid #2E5D4E" : "none" }}>
          <button style={{ display: "flex", alignItems: "center", gap: "10px", width: "100%", textAlign: "left", background: "none", border: "none", cursor: "pointer", padding: "11px 13px", fontFamily: "inherit", color: "#22333B" }} aria-expanded={open} onClick={() => setOpen(!open)}>
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
                <span style={{ fontFamily: "Bricolage Grotesque, sans-serif", fontWeight: 700, fontSize: "15px", letterSpacing: "-0.01em" }}>{meas.name}</span>
                <span style={{ fontSize: "11px", fontWeight: 700, borderRadius: "999px", padding: "2px 8px", background: statusClass, color: entry.status === "Completed" ? "#fff" : "#5D6B70" }}>{entry.status || "Not yet"}</span>
                {n > 0 ? <span style={{ fontSize: "11px", fontWeight: 700, color: "#fff", background: "#2E5D4E", borderRadius: "999px", minWidth: "18px", textAlign: "center", padding: "1px 6px" }}>{n}</span> : null}
              </div>
              <div style={{ fontSize: "12px", color: "#5D6B70", marginTop: "2px" }}>{meas.who}</div>
            </div>
            <span style={{ transition: "transform .2s", color: "#B0A98F", flexShrink: 0, transform: open ? "rotate(180deg)" : "none" }}>▼</span>
          </button>
          {open ? (
            <div style={{ padding: "0 13px 14px" }}>
              <div style={{ fontSize: "12.5px", fontWeight: 600, color: "#5D6B70", marginBottom: "3px" }}>{meas.full}</div>
              <div style={{ fontSize: "13px", color: "#5D6B70", lineHeight: "1.5", marginTop: "3px" }}>{meas.what}</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px", marginTop: "12px" }}>
                <label style={{ display: "block" }}>
                  <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>Status</div>
                  <select style={{ width: "100%", fontFamily: "inherit", fontSize: "16px", padding: "10px 12px", border: "1px solid #E3DFD3", borderRadius: "11px", background: "#FDFCF9", color: "#22333B" }} value={entry.status || "Not yet"} onChange={(e) => onEntry({ status: e.target.value })}>
                    {MEASURE_STATUS.map((s) => <option key={s}>{s}</option>)}
                  </select>
                </label>
                <label style={{ display: "block" }}>
                  <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>Date</div>
                  <input style={{ width: "100%", fontFamily: "inherit", fontSize: "16px", padding: "10px 12px", border: "1px solid #E3DFD3", borderRadius: "11px", background: "#FDFCF9", color: "#22333B" }} type="date" value={entry.date || ""} onChange={(e) => onEntry({ date: e.target.value })} />
                </label>
              </div>
              <div style={{ marginTop: "12px" }}>
                <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>Result</div>
                <AutoTA value={entry.score} onChange={(v) => onEntry({ score: v })} placeholder={meas.scoreHint} minRows={1} />
              </div>
            </div>
          ) : null}
        </div>
      );
    }

    /* ============================================================ STEP 2 : FORMULATE */
    function FormulateStep({ data, update, names }) {
      const f = data.formulation || {};
      const setF = (k, v) => update({ formulation: { ...f, [k]: v } });
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
          <SectionIntro title="Connect the dots" body="A formulation is a working story: it gathers what is known and offers a best explanation, so the plan of care can come straight from it. Move from what happened to what it means." />

          <div style={{ background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px", padding: "14px" }}>
            <div style={{ fontFamily: "Bricolage Grotesque, sans-serif", fontWeight: 700, fontSize: "16px", letterSpacing: "-0.01em", marginBottom: "8px" }}>From the worksheet</div>
            <div style={{ fontSize: "13px", color: "#5D6B70", marginTop: "4px" }}>Everything the assessments gave you, in one place while you write.</div>
          </div>

          <Collapse title="The working story" sub="What happened, and what does it mean?">
            <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              <label style={{ display: "block" }}>
                <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>Mapping the problem</div>
                <div style={{ fontSize: "13px", color: "#5D6B70", marginTop: "4px" }}>One problem or many? Did they start together after the same event? Did one cause another?</div>
                <AutoTA value={f.problemMap} onChange={(v) => setF("problemMap", v)} minRows={3} />
              </label>
              <label style={{ display: "block" }}>
                <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>The working story</div>
                <div style={{ fontSize: "13px", color: "#5D6B70", marginTop: "4px" }}>What happened, and what does it mean? Two honest paragraphs beat five perfect ones.</div>
                <AutoTA value={f.meaning} onChange={(v) => setF("meaning", v)} minRows={3} />
              </label>
              <label style={{ display: "block" }}>
                <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>Decode a moment</div>
                <div style={{ fontSize: "13px", color: "#5D6B70", marginTop: "4px" }}>Describe one moment of play or interaction that lingers after the visit, then ask what {names.child} might be saying with it.</div>
                <AutoTA value={f.playMoment} onChange={(v) => setF("playMoment", v)} minRows={3} />
              </label>
              <label style={{ display: "block", background: "#FBFAF6", border: "1px solid #EFD9B4", borderRadius: "13px", padding: "12px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "6px" }}><span>❝</span><div style={{ fontWeight: 700, fontSize: "15px", color: "#22333B" }}>In {names.caregiver}'s own words</div></div>
                <div style={{ fontSize: "13px", color: "#5D6B70", marginTop: "4px" }}>Ask what she wants to be different in six months, and write the answer down word for word.</div>
                <AutoTA value={f.caregiverWords} onChange={(v) => setF("caregiverWords", v)} minRows={3} />
              </label>
            </div>
          </Collapse>

          <Collapse title="Both roles" sub="Where this family is and where you're starting">
            <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              <label style={{ display: "block" }}>
                <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>For {names.partner}</div>
                <div style={{ fontSize: "13px", color: "#5D6B70", marginTop: "4px" }}>Hunches stay labeled as hunches. Questions are contributions too.</div>
                <AutoTA value={f.bringToClinician} onChange={(v) => setF("bringToClinician", v)} minRows={3} />
              </label>
            </div>
          </Collapse>
        </div>
      );
    }

    /* ============================================================ STEP 3 : GOALS */
    function GoalsStep({ data, update, names }) {
      const goals = data.goals || [];
      const cw = ((data.formulation && data.formulation.caregiverWords) || "").trim();
      const setGoals = (g) => update({ goals: g });
      const addGoal = () => setGoals([...goals, { id: uid(), themeId: "", concern: "", goal: "", objectives: [], interventions: [] }]);
      const patchGoal = (id, patch) => setGoals(goals.map((g) => (g.id === id ? { ...g, ...patch } : g)));
      const removeGoal = (id) => setGoals(goals.filter((g) => g.id !== id));

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
          <SectionIntro title="Goals in the family's voice" body={"Two checks for every goal. Kitchen table test: read it out loud; would " + names.caregiver + " say it at her own table? Hero check: if the professionals are the heroes of the sentence, flip it until she is."} />

          {cw ? (
            <div style={{ display: "flex", gap: "10px", background: "#FBFAF6", border: "1px solid #EFD9B4", borderRadius: "14px", padding: "12px" }}>
              <span>❝</span>
              <div><div style={{ fontSize: "11px", fontWeight: 700, letterSpacing: "0.07em", textTransform: "uppercase", color: "#8A6A2C" }}>Her words, from the formulation</div><div style={{ fontSize: "14.5px", fontStyle: "italic", color: "#5C4B22", marginTop: "2px" }}>{cw}</div></div>
            </div>
          ) : null}

          {goals.map((g, idx) => (
            <GoalCard key={g.id} g={g} idx={idx} patch={(p) => patchGoal(g.id, p)} remove={() => removeGoal(g.id)} names={names} />
          ))}

          <button style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "7px", background: "#2E5D4E", color: "#fff", border: "none", cursor: "pointer", padding: "12px 18px", borderRadius: "999px", fontWeight: 600, fontSize: "14.5px", fontFamily: "inherit", width: "100%" }} onClick={addGoal}>➕ Add a goal</button>
        </div>
      );
    }

    function GoalCard({ g, idx, patch, remove, names }) {
      const [armed, setArmed] = useState(false);
      const addObjective = (text) => patch({ objectives: [...g.objectives, { id: uid(), text: text || "", freq: "Weekly" }] });
      const patchObjective = (id, p) => patch({ objectives: g.objectives.map((o) => (o.id === id ? { ...o, ...p } : o)) });
      const removeObjective = (id) => patch({ objectives: g.objectives.filter((o) => o.id !== id) });
      const addIntervention = (who, text) => patch({ interventions: [...g.interventions, { id: uid(), who: who || "FRP", text: text || "" }] });
      const patchIntervention = (id, p) => patch({ interventions: g.interventions.map((o) => (o.id === id ? { ...o, ...p } : o)) });
      const removeIntervention = (id) => patch({ interventions: g.interventions.filter((o) => o.id !== id) });

      return (
        <div style={{ background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px", overflow: "hidden" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#22333B", color: "#F4F1E6", padding: "9px 16px" }}>
            <div style={{ fontFamily: "Bricolage Grotesque, sans-serif", fontWeight: 700, fontSize: "14px", letterSpacing: "0.03em" }}>Goal {idx + 1}</div>
            <button aria-label="Delete goal" style={{ background: armed ? "#A9603F" : "transparent", color: armed ? "#fff" : "#9BA6A0", border: "1px solid transparent", borderRadius: "12px", padding: "0 10px", fontFamily: "inherit", fontSize: "12px", fontWeight: 700, cursor: "pointer" }} onClick={() => (armed ? remove() : setArmed(true))} onBlur={() => setArmed(false)}>
              {armed ? "Sure?" : "🗑"}
            </button>
          </div>

          <div style={{ padding: "16px", display: "flex", flexDirection: "column", gap: "16px" }}>
            <label style={{ display: "block" }}>
              <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>Concern, in plain words</div>
              <AutoTA value={g.concern} onChange={(v) => patch({ concern: v })} placeholder="What is happening, and why it matters for this child" />
            </label>

            <label style={{ display: "block", background: "#FBFAF6", border: "1px solid #EFD9B4", borderRadius: "13px", padding: "12px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "6px" }}><span>❝</span><div style={{ fontWeight: 700, fontSize: "15px", color: "#22333B" }}>Goal, in {names.caregiver}'s voice</div></div>
              <div style={{ fontSize: "13px", color: "#5D6B70", marginTop: "4px" }}>First person. "I want..." Read it out loud before keeping it.</div>
              <AutoTA value={g.goal} onChange={(v) => patch({ goal: v })} minRows={2} />
            </label>

            <label style={{ display: "block" }}>
              <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>Objectives (measurable milestones)</div>
              <div style={{ fontSize: "12.5px", color: "#5D6B70", marginBottom: "8px" }}>Make each one countable: who does what, how often, noticed by whom.</div>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {g.objectives.map((o, i) => (
                  <div key={o.id} style={{ display: "flex", gap: "8px", alignItems: "flex-start" }}>
                    <div style={{ fontFamily: "Bricolage Grotesque, sans-serif", fontWeight: 700, fontSize: "13px", color: "#fff", background: "#2E5D4E", borderRadius: "8px", width: "24px", height: "24px", display: "flex", alignItems: "center", justifyContent: "center", marginTop: "8px", flexShrink: 0 }}>{i + 1}</div>
                    <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: "6px" }}>
                      <AutoTA value={o.text} onChange={(v) => patchObjective(o.id, { text: v })} placeholder="Milestone" minRows={1} />
                      <select style={{ width: "100%", fontSize: "13px", padding: "6px 8px", color: "#5D6B70", fontFamily: "inherit", border: "1px solid #E3DFD3", borderRadius: "8px", background: "#FDFCF9" }} value={o.freq} onChange={(e) => patchObjective(o.id, { freq: e.target.value })}>
                        {["Weekly", "Semi-weekly", "Bi-weekly", "Monthly", "Daily", "As needed"].map((fq) => <option key={fq}>{fq}</option>)}
                      </select>
                    </div>
                    <button style={{ background: "none", border: "none", color: "#C0B9A5", cursor: "pointer", padding: "3px", borderRadius: "7px", marginTop: "8px" }} aria-label="Remove objective" onClick={() => removeObjective(o.id)}>🗑</button>
                  </div>
                ))}
              </div>
              <button style={{ display: "inline-flex", alignItems: "center", gap: "5px", marginTop: "8px", background: "none", border: "1px dashed #C8C2B0", color: "#2E5D4E", cursor: "pointer", padding: "6px 12px", borderRadius: "999px", fontSize: "13px", fontWeight: 600, fontFamily: "inherit" }} onClick={() => addObjective("")}>➕ objective</button>
            </label>

            <label style={{ display: "block" }}>
              <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#5D6B70", marginBottom: "5px" }}>Interventions (who does what)</div>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {g.interventions.map((o) => (
                  <div key={o.id} style={{ display: "flex", gap: "8px", alignItems: "flex-start" }}>
                    <select style={{ width: "118px", flexShrink: 0, fontSize: "13px", padding: "9px 8px", color: "#5D6B70", fontFamily: "inherit", fontWeight: 600, border: "1px solid #E3DFD3", borderRadius: "8px", background: "#FDFCF9", marginTop: "1px" }} value={o.who} onChange={(e) => patchIntervention(o.id, { who: e.target.value })}>
                      {["FRP", "Clinician", "Together", "Caregiver"].map((w) => <option key={w}>{w}</option>)}
                    </select>
                    <div style={{ flex: 1 }}><AutoTA value={o.text} onChange={(v) => patchIntervention(o.id, { text: v })} placeholder="Method, in real-life terms" minRows={1} /></div>
                    <button style={{ background: "none", border: "none", color: "#C0B9A5", cursor: "pointer", padding: "3px", borderRadius: "7px", marginTop: "8px" }} aria-label="Remove intervention" onClick={() => removeIntervention(o.id)}>🗑</button>
                  </div>
                ))}
              </div>
              <button style={{ display: "inline-flex", alignItems: "center", gap: "5px", marginTop: "8px", background: "none", border: "1px dashed #C8C2B0", color: "#2E5D4E", cursor: "pointer", padding: "6px 12px", borderRadius: "999px", fontSize: "13px", fontWeight: 600, fontFamily: "inherit" }} onClick={() => addIntervention("FRP", "")}>➕ intervention</button>
            </label>
          </div>
        </div>
      );
    }

    /* ============================================================ STEP 4 : EXPORT */
    function ExportStep({ data, names }) {
      const [copied, setCopied] = useState(false);
      const md = buildMarkdown(data, names);
      const goalCount = (data.goals || []).length;

      const download = () => {
        try {
          const blob = new Blob([md], { type: "text/markdown" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const name = (data.setup.child || "draft").replace(/[^a-z0-9]/gi, "-").toLowerCase();
          a.href = url;
          a.download = "plan-draft-" + name + ".md";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        } catch (e) {}
      };

      const copy = async () => {
        try {
          await navigator.clipboard.writeText(md);
          setCopied(true);
          setTimeout(() => setCopied(false), 1600);
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = md;
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            setCopied(true);
            setTimeout(() => setCopied(false), 1600);
          } catch (e2) {}
          ta.remove();
        }
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
          <SectionIntro title="Take it to the table" body={"Everything below compiles into one clean document to bring to the team. Download the markdown, copy it, or print it."} />

          <div style={{ background: "#FFFFFF", border: "1px solid #E3DFD3", borderRadius: "16px", padding: "16px" }}>
            <div style={{ fontWeight: 700, fontSize: "15px", color: "#22333B" }}>This draft holds</div>
            <div style={{ fontSize: "13.5px", color: "#5D6B70", marginTop: "4px" }}>{goalCount} goal{goalCount === 1 ? "" : "s"} · {(data.strengthsBank || []).length} banked strength{(data.strengthsBank || []).length === 1 ? "" : "s"}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginTop: "16px" }}>
              <button style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "7px", background: "#2E5D4E", color: "#fff", border: "none", cursor: "pointer", padding: "12px 18px", borderRadius: "999px", fontWeight: 600, fontSize: "14.5px", fontFamily: "inherit", width: "100%" }} onClick={download}>⬇️ Download .md</button>
              <button style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "7px", background: "#FFFFFF", color: "#22333B", border: "1px solid #E3DFD3", cursor: "pointer", padding: "12px 18px", borderRadius: "999px", fontWeight: 600, fontSize: "14.5px", fontFamily: "inherit", width: "100%" }} onClick={copy}>{copied ? "✓" : "📋"} {copied ? "Copied" : "Copy markdown"}</button>
              <button style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "7px", background: "#FFFFFF", color: "#22333B", border: "1px solid #E3DFD3", cursor: "pointer", padding: "12px 18px", borderRadius: "999px", fontWeight: 600, fontSize: "14.5px", fontFamily: "inherit", width: "100%" }} onClick={() => window.print()}>🖨️ Print / save as PDF</button>
            </div>
          </div>

          <div style={{ fontSize: "12.5px", color: "#5D6B70", background: "#EAF2EC", border: "1px solid #CBDDCE", borderRadius: "12px", padding: "10px 13px", lineHeight: "1.5" }}>This file carries the whole case, so you can reopen it later with <b>Restore a case from a .md backup</b> on the home screen. Keep the backup line at the bottom intact.</div>
        </div>
      );
    }

    function buildMarkdown(data, names) {
      const s = data.setup;
      const f = data.formulation || {};
      const L = [];
      const push = (t) => L.push(t);

      push("# Child First Treatment Planning Contribution");
      push("");
      push("Prepared by " + (s.frp || "the " + names.role) + " (" + names.role + ")" + (s.clinician ? " for review with " + s.clinician : "") + ".");
      push("");
      push("Child: " + (s.child || "...") + (s.age ? " (" + s.age + ")" : "") + " · Caregiver: " + (s.caregiver || "..."));
      push("");
      push("> Working draft of one team member's contribution, brought to the clinical team. It is not a diagnosis and not the official Plan of Care.");

      if (bagCount((f.lenses || {})) > 0 || Object.keys(f).some((k) => k !== "lenses" && k !== "rubric" && (f[k] || "").trim())) {
        push("");
        push("## Formulation: connecting the dots");
        if ((f.problemMap || "").trim()) { push(""); push("### Mapping the problem"); push(f.problemMap.trim()); }
        if ((f.meaning || "").trim()) { push(""); push("### The working story"); push(f.meaning.trim()); }
        if ((f.playMoment || "").trim()) { push(""); push("### Decoding a moment"); push(f.playMoment.trim()); }
        if ((f.caregiverWords || "").trim()) { push(""); push("### In " + (s.caregiver || "the caregiver") + "'s own words"); push('"' + f.caregiverWords.trim() + '"'); }
      }

      if ((data.goals || []).length) {
        push("");
        push("## Draft goals for the Plan of Care");
        data.goals.forEach((g, i) => {
          push("### Goal " + (i + 1));
          if ((g.concern || "").trim()) push("**Concern:** " + g.concern.trim());
          if ((g.goal || "").trim()) { push(""); push("**Goal (in " + (s.caregiver || "the caregiver") + "'s voice):**"); push(""); push('> "' + g.goal.trim() + '"'); }
          if (g.objectives.length) { push(""); push("**Objectives:**"); g.objectives.forEach((o, j) => { if ((o.text || "").trim()) push((j + 1) + ". " + o.text.trim() + " (" + o.freq + ")"); }); }
          if (g.interventions.length) { push(""); push("**Interventions:**"); g.interventions.forEach((o) => { if ((o.text || "").trim()) push("- (" + o.who + ") " + o.text.trim()); }); }
          push("");
        });
      }

      push("---");
      push("Drafted in Side by Side and brought to the clinical team for the official Child and Family Plan of Care. Signatures, in order: Clinician, Care Coordinator / Family Resource Partner, Supervisor.");

      const b64 = encodeBackup(data);
      if (b64) {
        push("");
        push("<!-- Backup data for re-import into Side by Side. Keep this line to restore the case later; it does not print. -->");
        push("<!-- SIDE_BY_SIDE_BACKUP:v1:BASE64 " + b64 + " -->");
      }
      return L.join("\n");
    }

    // ============================================================ RENDER
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
